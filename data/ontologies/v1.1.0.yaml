metadata:
  name: Enterprise Search Ontology (Confluence connector)
  version: 1.1.0
changelog:
- '1.0.0 seed: hand-written core types'
- '1.0.1 round 1 rules: code_shapes: snake_case identifier; stop list +7'
- '1.1.0 round 1 links: dropped PRECEDES (endpoint type missing); widen CALLS; widen MEASURES'
entity_types:
- name: Space
  description: A Confluence space
  strategy: metadata
- name: Document
  description: A Confluence page
  strategy: metadata
  aliases:
  - Page
- name: Label
  description: A Confluence label
  strategy: metadata
- name: JiraIssue
  description: A Jira ticket referenced by key (e.g. ORB-2291)
  strategy: regex
  aliases:
  - Ticket
  - Issue
- name: Person
  description: A named employee or contact
  strategy: llm
  aliases:
  - Engineer
  - Employee
  - Author
  - Owner
- name: Team
  description: An engineering or business team
  strategy: llm
  aliases:
  - Group
  - Squad
- name: Service
  description: A deployable software service or API
  strategy: llm
  aliases:
  - Microservice
  - System
  - Application
- name: Component
  description: A module
  class or internal part of a service: null
  strategy: llm
  aliases:
  - Module
  - Class
  - Function
- name: DataStore
  description: A database
  index: null
  bucket or collection: null
  strategy: llm
  aliases:
  - Database
  - Collection
  - Index
  - Bucket
- name: APIEndpoint
  description: An HTTP endpoint such as POST /api/chats/list
  strategy: llm
  aliases:
  - Endpoint
  - API
- name: LLMModel
  description: A machine learning or language model
  strategy: llm
  aliases:
  - Model
- name: Metric
  description: A measured quantity used for evaluation or monitoring
  strategy: llm
relationships:
- verb: MEMBER_OF
  source:
  - Person
  target:
  - Team
  description: person belongs to team
- verb: LEADS
  source:
  - Person
  target:
  - Team
  description: person leads team
- verb: OWNS
  source:
  - Team
  target:
  - Service
  - Component
  - DataStore
  description: team is responsible for it
- verb: PART_OF
  source:
  - Component
  target:
  - Service
  - Component
  description: component is part of a larger unit
- verb: CALLS
  source:
  - Component
  - Service
  target:
  - APIEndpoint
  - Component
  - DataStore
  - Service
  description: runtime call or dependency
- verb: EXPOSES
  source:
  - Service
  target:
  - APIEndpoint
  description: service serves the endpoint
- verb: STORES_IN
  source:
  - Service
  - Component
  target:
  - DataStore
  description: reads or writes data in the store
- verb: USES_MODEL
  source:
  - Service
  - Component
  target:
  - LLMModel
  description: calls the model
- verb: MEASURES
  source:
  - Metric
  target:
  - APIEndpoint
  - Component
  - DataStore
  - LLMModel
  - Service
  description: metric evaluates it
name_rules:
  code_shapes:
  - ^_?[a-z][a-z0-9]*(_[a-z0-9]+)+$
  id_shapes: []
  stop_list:
  - _shell(tenant)
  - content_delta
  - conversation_id
  - done
  - error
  - message_id
  - sender
  shape_exempt:
  - JiraIssue
  - APIEndpoint
  - DataStore
  - Metric
